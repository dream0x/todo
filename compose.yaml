services:
  web:
    container_name: web
    build: ./container/web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - ./container/web/conf:/etc/caddy
      # - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

  front:
    container_name: front
    build: ./container/front
    user: 1000:1000
    working_dir: /home/node/front
    volumes:
      - ./src/front:/home/node/front
    init: true
    tty: true
    command: npx expo start --tunnel -p 3000

  back:
    container_name: back
    build: ./container/back
    user: 1000:1000
    working_dir: /home/ubuntu/back
    volumes:
      - ./src/back:/home/ubuntu/back
      - gradle_cache:/home/ubuntu/.gradle
    init: true
    command: ./gradlew bootRun
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=app
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db

  db:
    container_name: db
    build: ./container/db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  caddy_data:
  caddy_config:
  gradle_cache:

