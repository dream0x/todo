spring:
  application:
    name: spring
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
mybatis:
  mapper-locations: classpath:com/app/domain/**/*.xml
  type-handlers-package: com.app.mybatis
server:
  port: 8000
  servlet:
    context-path: /api
